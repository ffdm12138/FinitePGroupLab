name: Public release verification

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Verify public-only file allowlist and release manifest
        run: python3 scripts/audit_release.py --all
      - name: Test release-gate and target-verification guards
        run: python3 -m unittest discover -s scripts -p 'test_*.py'

  lean:
    needs: hygiene
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Lean and fetch pinned Mathlib
        uses: leanprover/lean-action@fe408643ea7367d8c0404a8be3975bb145f5fb64 # v1.7.0
        with:
          auto-config: false
          use-github-cache: false
          use-mathlib-cache: true
      - name: Check curated public Lean targets incrementally
        run: python3 scripts/verify_lean_targets.py --elan
